name: Fetch institutional gap refs
# 「所管の隙間＝誰も把握していない量」の一次資料取得（第5ラウンド）。
# サンドボックスからは soumu.go.jp / jbaudit.go.jp / maff.go.jp などが egress 遮断
# されるため、Actions で取得して gap-refs ブランチにコミットする。
# トリガ: trigger-fetch-gap ブランチへの push
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-gap"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch institutional gap references
        run: python3 "30_theme2_ライフライン復旧/fetch_gap_refs.py"
      - name: Commit to gap-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B gap-refs
          git add -f gap_refs
          git commit -m "所管の隙間の一次資料取得結果（Actions経由）"
          git push -f origin gap-refs
