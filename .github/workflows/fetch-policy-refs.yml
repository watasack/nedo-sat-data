name: Fetch policy refs (C/G/E)
# テーマ2の未解決 C（下流被害額の原単位）・G（再委託の制度上の可否）・E（リアルタイムHMの発注実態）の
# 一次資料を取得する。いずれも静的公開の制度文書・マニュアル・発注情報。
# サンドボックスからは mlit.go.jp 等が egress 遮断されているため Actions 迂回。
# トリガ: trigger-fetch-policy ブランチへの push（workflow_dispatch API はこの環境では 403）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-policy"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch refs
        run: python3 "30_theme2_ライフライン復旧/fetch_policy_refs.py"
      - name: Drop oversized files
        # 取得側でも40MBで打ち切っているが、押さえの網。100MB超が1つでもあると
        # ブランチ全体が pre-receive で弾かれるため、コミット前に落とす。
        run: find policy_refs -type f -size +90M -print -delete || true
      - name: Commit to policy-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B policy-refs
          git add -f policy_refs
          git commit -m "未解決C/G/Eの一次資料（Actions経由）" || echo "no changes"
          git push -f origin policy-refs
