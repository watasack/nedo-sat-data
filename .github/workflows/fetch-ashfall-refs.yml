name: Fetch ashfall refs
# テーマ2（降灰）の一次情報取得。サンドボックスからは bousai.go.jp / jsece.or.jp /
# jma.go.jp などが egress 遮断（CONNECT に 403）されているため、制限のない
# Actions ランナーで取得して ashfall-refs ブランチにコミットする。
# トリガ: trigger-fetch-ashfall ブランチへのpush（workflow_dispatch APIは
# この環境のGitHub統合では403なので push 駆動にする。他の fetch-* と同じ方式）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-ashfall"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch ashfall references
        run: python3 "theme2_ライフライン復旧/fetch_ashfall_refs.py"
      - name: Commit to ashfall-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ashfall-refs
          git add -f ashfall_refs
          git commit -m "降灰テーマの一次情報取得結果（Actions経由）"
          git push -f origin ashfall-refs
