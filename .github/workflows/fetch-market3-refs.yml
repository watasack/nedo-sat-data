name: Fetch market refs 3rd batch (theme2)
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-market3"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch references
        run: python3 "30_theme2_ライフライン復旧/fetch_market3_refs.py"
      - name: Commit to market-refs3 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B market-refs3
          git add -f market_refs3
          git commit -m "テーマ2 事業性調査 第3バッチ"
          git push -f origin market-refs3
