name: Fetch facility refs
# 未解決C（15_事業計画の裏付け.md 3.3節・10節）を閉じるための取得。
# サンドボックスからは meti.go.jp / env.go.jp / jdhc.or.jp / paj.gr.jp / khk.or.jp とも
# egress 遮断されており、08 付録E の施設数（150〜250サイト等）に一次出典が無いまま
# ⑤に「セグメント別積算で年20〜40億円」と書いている状態を直せない（投資家 V1-5・V1-6）。
# ネットワーク制限のない Actions ランナーで取得し、facility-refs ブランチにコミットする。
# トリガ: trigger-fetch-facility ブランチへのpush（サンドボックスのGitHub統合は
# workflow_dispatch APIを叩けないため push 駆動。fetch-koubo-docs.yml と同じ方式）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-facility"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch facility and certification references
        run: python3 fetch_facility_refs.py
      - name: Commit refs to facility-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B facility-refs
          git add -f facility_refs
          git commit -m "施設数・認定制度の一次資料の取得結果（Actions経由。未解決C）"
          git push -f origin facility-refs
