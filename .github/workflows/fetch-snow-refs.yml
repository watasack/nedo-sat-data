name: Fetch snow/volcano-lahar refs
# 融雪型火山泥流・融雪地すべり案（第7ラウンド）の一次情報取得。
# mlit/thr.mlit/bousai/jstage などが egress 遮断されるため Actions 経由で取得し、
# snow-refs ブランチにコミットする。
# トリガ: trigger-fetch-snow ブランチへの push
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-snow"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch references
        run: python3 "30_theme2_ライフライン復旧/fetch_snow_refs.py"
      - name: Commit to snow-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B snow-refs
          git add -f snow_refs
          git commit -m "融雪型火山泥流・融雪地すべり案の一次情報取得結果（Actions経由）"
          git push -f origin snow-refs
