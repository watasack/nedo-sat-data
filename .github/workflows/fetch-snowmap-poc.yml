name: Fetch snow disappearance map PoC
# テーマ2 J-2 対応。蔵王山の火口半径3kmについて実Landsatから消雪日マップを試作する。
# サンドボックスからは Planetary Computer が egress 遮断されているため Actions 迂回。
# トリガ: trigger-fetch-snowmap ブランチへの push（workflow_dispatch API はこの環境では 403）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-snowmap"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compute snow disappearance maps
        run: python3 "theme2_ライフライン復旧/fetch_snowmap_poc.py"
      - name: Drop oversized files
        run: find snowmap_poc -type f -size +90M -print -delete || true
      - name: Commit to snowmap-poc branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B snowmap-poc
          git add -f snowmap_poc
          git commit -m "蔵王山の消雪日マップ試作（実Landsat・Actions経由）" || echo "no changes"
          git push -f origin snowmap-poc
