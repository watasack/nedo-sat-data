name: Fetch power disaster refs
# テーマ2（電力インフラの防災・災害対応）の一次情報取得。サンドボックスからは
# meti.go.jp / bousai.go.jp / mlit.go.jp / occto.or.jp などが egress 遮断
# （CONNECT に 403）されているため、制限のない Actions ランナーで取得して
# power-refs ブランチにコミットする。
# トリガ: trigger-fetch-power ブランチへのpush（workflow_dispatch APIは
# この環境のGitHub統合では403なので push 駆動にする。他の fetch-* と同じ方式）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-power"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch power disaster references
        run: python3 "theme2_ライフライン復旧/fetch_power_disaster_refs.py"
      - name: Commit to power-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B power-refs
          git add -f power_refs
          git commit -m "電力防災の一次情報取得結果（Actions経由）"
          git push -f origin power-refs
