name: Fetch sabo bid refs
# テーマ2の事業性（単価＝契約金額）の一次資料を取得する。
# 第3バッチで落札金額が一件も取れなかったので、静的公開されている契約結果一覧PDFだけを狙う。
# サンドボックスからは mlit.go.jp 等が egress 遮断されているため Actions 迂回。
# トリガ: trigger-fetch-bid ブランチへの push（workflow_dispatch API はこの環境では 403）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-bid"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch refs
        run: python3 "theme2_ライフライン復旧/fetch_bid_refs.py"
      - name: Drop oversized files
        # 取得側でも40MBで打ち切っているが、押さえの網。100MB超が1つでもあると
        # ブランチ全体が pre-receive で弾かれるため、コミット前に落とす。
        run: find bid_refs -type f -size +90M -print -delete || true
      - name: Commit to bid-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B bid-refs
          git add -f bid_refs
          git commit -m "火山砂防の契約金額の一次資料（Actions経由）" || echo "no changes"
          git push -f origin bid-refs
