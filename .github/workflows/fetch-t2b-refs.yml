name: Fetch theme2-B refs
# テーマ2の新規切り口探索用の一次資料（内閣府防災・国交省・自治体検証報告等）を取得する。
# サンドボックスからは bousai.go.jp / mlit.go.jp 等が egress 遮断されているため Actions 迂回。
# トリガ: trigger-fetch-t2b ブランチへの push（workflow_dispatch API はこの環境では 403）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-t2b"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch refs
        run: python3 fetch_t2b_refs.py
      - name: Commit to t2b-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B t2b-refs
          git add -f t2b_refs
          git commit -m "テーマ2 新規切り口探索用の一次資料（Actions経由）" || echo "no changes"
          git push -f origin t2b-refs
