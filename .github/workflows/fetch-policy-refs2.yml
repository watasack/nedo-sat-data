name: Fetch policy refs 2 (C/G/E gaps)
# 第1バッチ（fetch-policy-refs.yml）の取りこぼしだけを狙う第2バッチ。
# 1住宅当たり延べ面積（C）、関東・東北版のガイドラインと国交省本省の共同設計方式通達（G）、
# 雌阿寒岳のRTHM作成業務の発注元公告（E）。あわせて第1バッチのファイル名衝突を直してある。
# トリガ: trigger-fetch-policy2 ブランチへの push
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-policy2"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch refs
        run: python3 "theme2_ライフライン復旧/fetch_policy_refs2.py"
      - name: Drop oversized files
        run: find policy_refs2 -type f -size +90M -print -delete || true
      - name: Commit to policy-refs2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B policy-refs2
          git add -f policy_refs2
          git commit -m "未解決C/G/Eの一次資料 第2バッチ（Actions経由）" || echo "no changes"
          git push -f origin policy-refs2
