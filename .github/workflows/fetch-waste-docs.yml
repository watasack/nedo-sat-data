name: Fetch disaster waste docs
# テーマ2候補（災害廃棄物の発生量を衛星で推定）の一次情報取得。
# サンドボックスからは env.go.jp / soumu.go.jp / pref.ishikawa.lg.jp / jstage 等が
# すべて egress 遮断されているため、Actions ランナーで取得して waste-docs ブランチに置く。
# トリガ: trigger-fetch-waste ブランチへの push（workflow_dispatch API は403のため push 駆動）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-waste"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch documents
        run: python3 fetch_waste_docs.py
      - name: Commit docs to waste-docs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B waste-docs
          git add -f waste_docs
          git commit -m "災害廃棄物 発生量推計の一次情報（Actions経由）"
          git push -f origin waste-docs
