name: Fetch kyusho4b
# 18_テーマ代替案の検討.md 4.16節で生存した4候補の急所（各1件）を一次資料で閉じるための取得。
# サンドボックスからは mlit / env / gsi / e-Gov とも egress 遮断（プロキシが403）なので、
# 制限のない Actions ランナーで取得し kyusho4b ブランチにコミットする。
# トリガ: trigger-fetch-kyusho4b ブランチへのpush（workflow_dispatch APIは403のため push 駆動）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-kyusho4b"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch kyusho references
        run: python3 40_scripts/fetch_kyusho4b.py
      - name: Commit refs to kyusho4b branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B kyusho4b
          git add -f kyusho4b
          git commit -m "生存4件の急所を閉じるための一次資料（Actions経由）"
          git push -f origin kyusho4b
