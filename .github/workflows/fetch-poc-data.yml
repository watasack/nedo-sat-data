name: Fetch PoC data
# クラウドサンドボックスからは外部データAPIに届かないため、
# ネットワーク制限のないGitHub Actionsランナーで実データを取得し
# poc-data ブランチにコミットする（手動トリガ専用）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run downloader (Open-Meteo + Landsat ST_B10)
        run: python3 download_poc_data.py
      - name: Commit data to poc-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B poc-data
          mkdir -p poc/data
          cp -r poc_data/. poc/data/
          git add -f poc/data
          git commit -m "PoC実データ: Open-Meteo気象CSV + Landsat C2L2 ST_B10切り出し"
          git push -f origin poc-data
