name: Fetch koubo docs
# クラウドサンドボックスからは nedo.go.jp / space-data-challenge.nedo.go.jp とも
# egress 遮断されており、10_提出様式メモ.md の事務条項を一次情報で埋められない。
# ネットワーク制限のない GitHub Actions ランナーで要項PDF・特設サイトを取得し
# koubo-docs ブランチにコミットする。
# トリガ: trigger-fetch-koubo ブランチへのpush（サンドボックスのGitHub統合は
# workflow_dispatch APIを叩けないため、push駆動にしている。fetch-poc-data.yml と同じ方式）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-koubo"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch koubo documents
        run: python3 40_scripts/fetch_koubo_docs.py
      - name: Commit docs to koubo-docs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B koubo-docs
          git add -f koubo_docs
          git commit -m "公募要項・特設サイトの取得結果（Actions経由）"
          git push -f origin koubo-docs
