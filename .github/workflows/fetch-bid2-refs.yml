name: Fetch bid refs 2 (那須岳R8の契約結果)
# 未解決B（火山砂防検討業務の契約金額）を、公告・入札期を過ぎた今なら取れる可能性があるので狙う。
# 受注者名が取れれば未解決A(d)、金額が取れれば未解決B、内訳が取れれば設計共同体の分担割合まで届く。
# トリガ: trigger-fetch-bid2 ブランチへの push
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-bid2"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch refs
        run: python3 "30_theme2_ライフライン復旧/fetch_bid2_refs.py"
      - name: Drop oversized files
        run: find bid2_refs -type f -size +90M -print -delete || true
      - name: Commit to bid-refs2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B bid-refs2
          git add -f bid2_refs
          git commit -m "那須岳R8の契約結果の探索（Actions経由）" || echo "no changes"
          git push -f origin bid-refs2
