name: Fetch salt damage refs
# 潮風害（塩害）×衛星の第5案検証用。サンドボックスからは criepi.denken.or.jp /
# link.springer.com / jma-net.go.jp などが egress 遮断されるため、Actions で取得して
# salt-refs2 ブランチにコミットする。STAC 問い合わせでシーン在庫も確認する。
# トリガ: trigger-fetch-salt2 ブランチへのpush
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-salt2"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch salt damage references
        run: python3 "theme2_ライフライン復旧/fetch_salt_refs.py"
      - name: Commit to salt-refs2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B salt-refs2
          git add -f salt_refs2
          git commit -m "潮風害×衛星の一次情報取得結果（Actions経由）"
          git push -f origin salt-refs2
