name: Fetch ICHARM refs (batch 2)
# ICHARM／玉川勝徳の積雪プラットフォーム調査 第2バッチ（直URL狙い撃ち）。
# トリガ: trigger-fetch-icharm2 ブランチへの push
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-icharm2"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch references
        run: python3 "theme2_ライフライン復旧/fetch_icharm_refs2.py"
      - name: Commit to icharm-refs2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B icharm-refs2
          git add -f icharm_refs2
          git commit -m "ICHARM積雪プラットフォーム調査 第2バッチ（一次情報の直URL）"
          git push -f origin icharm-refs2
