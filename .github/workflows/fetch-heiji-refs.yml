name: Fetch heiji (peacetime risk assessment) refs
# 第5ラウンド（応募例1＝平時の災害リスク評価）の一次情報取得。
# サンドボックスからは mlit/bousai/maff/soumu/jstage などが軒並み egress 遮断されるため、
# Actions で取得して heiji-refs ブランチにコミットする。
# トリガ: trigger-fetch-heiji ブランチへの push
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-heiji"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch references
        run: python3 "theme2_ライフライン復旧/fetch_heiji_refs.py"
      - name: Commit to heiji-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B heiji-refs
          git add -f heiji_refs
          git commit -m "平時の災害リスク評価（応募例1）の一次情報取得結果（Actions経由）"
          git push -f origin heiji-refs
