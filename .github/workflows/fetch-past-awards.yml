name: Fetch past awards
# 過去回（Green Earth／農林水産業）の受賞結果・審査委員・講評を取得する。
# サンドボックスからは nedo.go.jp / space-data-challenge / sorabatake が egress 遮断。
# トリガ: trigger-fetch-awards ブランチへの push（workflow_dispatch APIは403のため）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-awards"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler for PDF text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch award documents
        run: python3 40_scripts/fetch_past_awards.py
      - name: Extract PDF text
        run: |
          for f in past_awards/*.pdf; do
            [ -e "$f" ] || continue
            pdftotext -layout "$f" "$f.txt" || true
          done
      - name: Commit to past-awards branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B past-awards
          git add -f past_awards
          git commit -m "過去回受賞結果の取得（Actions経由）"
          git push -f origin past-awards
