name: Fetch S1/S2/S3 refs
# 18_テーマ代替案の検討.md 4.4節で生き残った3候補（S1 無許可盛土 / S2 河道内樹木 /
# S3 再エネ設備の管理不全）の即死条件＝例外(a)（同一顧客市場で商用展開済みか）と
# 制度の原典を閉じるための取得。サンドボックスからは mlit / env / meti とも
# egress 遮断（プロキシが403）なので、制限のない Actions ランナーで取得し
# s123-refs ブランチにコミットする。
# トリガ: trigger-fetch-s123 ブランチへのpush（サンドボックスのGitHub統合は
# workflow_dispatch APIを叩けないため push 駆動。fetch-facility-refs.yml と同じ方式）
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-s123"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch S1/S2/S3 references
        run: python3 40_scripts/fetch_s123_refs.py
      - name: Commit refs to s123-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B s123-refs
          git add -f s123_refs
          git commit -m "S1/S2/S3の即死条件を閉じるための一次資料（Actions経由）"
          git push -f origin s123-refs
