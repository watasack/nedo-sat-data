name: Fetch ICHARM refs
# 過去回Green Earthテーマ②審査委員特別賞（ICHARM／玉川勝徳「降雪・積雪・融雪量リアルタイム解析
# プラットフォーム」）の実体調査。先行技術評価と制度上の重複判定の裏取り用。
# トリガ: trigger-fetch-icharm ブランチへの push
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-icharm"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch references
        run: python3 "30_theme2_ライフライン復旧/fetch_icharm_refs.py"
      - name: Commit to icharm-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B icharm-refs
          git add -f icharm_refs
          git commit -m "ICHARM／玉川勝徳の積雪プラットフォーム実体調査 一次情報取得"
          git push -f origin icharm-refs
