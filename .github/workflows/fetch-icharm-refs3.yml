name: Fetch ICHARM refs (batch 3)
# ICHARM／玉川勝徳の積雪プラットフォーム調査 第3バッチ（直URLの詰め）。
# トリガ: trigger-fetch-icharm3 ブランチへの push
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-icharm3"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch references
        run: python3 "30_theme2_ライフライン復旧/fetch_icharm_refs3.py"
      - name: Commit to icharm-refs3 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B icharm-refs3
          git add -f icharm_refs3
          git commit -m "ICHARM積雪プラットフォーム調査 第3バッチ（ICHARM技術実体＋近接先行）"
          git push -f origin icharm-refs3
