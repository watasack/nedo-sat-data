name: Fetch market/procurement refs (theme2)
# テーマ2「火口周辺の積雪水量」案の事業性（発注実態・予算・電力接続・海外市場）の一次情報取得。
# トリガ: trigger-fetch-market ブランチへの push
on:
  workflow_dispatch:
  push:
    branches: ["trigger-fetch-market"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch references
        run: python3 "theme2_ライフライン復旧/fetch_market_refs.py"
      - name: Commit to market-refs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B market-refs
          git add -f market_refs
          git commit -m "テーマ2 事業性（発注実態・予算・電力接続・海外市場）の一次情報取得結果"
          git push -f origin market-refs
